name: Tweet Poster

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

jobs:
  post-tweets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests
          pip install git+https://github.com/PawiX25/twifork.git

      - name: Post pending tweets
        env:
          BEACON_URL:      ${{ secrets.BEACON_URL }}
          BEACON_SECRET:   ${{ secrets.BEACON_SECRET }}
          TWITTER_COOKIES: ${{ vars.TWITTER_COOKIES }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:         ${{ github.repository }}
        run: python tweet_poster.py
